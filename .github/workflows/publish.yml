name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b13 # v7
      - name: Set up stable Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Require successful Quality run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          query = urllib.parse.urlencode({"head_sha": sha, "event": "push", "status": "completed", "per_page": 20})
          url = f"https://api.github.com/repos/{repository}/actions/workflows/quality.yml/runs?{query}"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "YuE2-release-gate/1"}
          for attempt in range(30):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])
              successful = [run for run in runs if run.get("conclusion") == "success"]
              if successful:
                  print(f"Quality passed for {sha}: {successful[0]['html_url']}")
                  break
              if runs and all(run.get("conclusion") not in {None, "success"} for run in runs):
                  raise SystemExit(f"Quality did not pass for {sha}: {runs[0].get('conclusion')}")
              if attempt == 29:
                  raise SystemExit(f"No successful Quality run found for {sha}")
              time.sleep(10)
          PY
      - name: Verify tag and all package versions agree
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" - <<'PY'
          import pathlib
          import re
          import tomllib
          import os

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v") and ref != f"v{version}":
              raise SystemExit(f"Tag {ref} does not match package version {version}")
          for filename in ("client.py", "comfyui_nodes/client.py", "app/yue2_app/__init__.py"):
              text = pathlib.Path(filename).read_text(encoding="utf-8-sig")
              if not re.search(rf'^__version__\s*=\s*"{re.escape(version)}"$', text, re.M):
                  raise SystemExit(f"{filename} does not declare {version}")
          print(f"Validated v{version} at {os.environ['GITHUB_SHA']}")
          PY
      - name: Check whether this version already exists
        id: registry
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" - <<'PY'
          import json
          import os
          import sys
          import tomllib
          import urllib.request

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          with urllib.request.urlopen("https://api.comfy.org/nodes/yue2-t8/versions") as response:
              versions = json.load(response)
          exists = any(item.get("version") == version for item in versions)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")
          print(f"Registry version {version}: {'already exists' if exists else 'ready to publish'}")
          PY
      - name: Publish custom node
        if: steps.registry.outputs.exists != 'true'
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Verify Registry accepted the version
        shell: bash
        run: |
          "${{ steps.python.outputs.python-path }}" - <<'PY'
          import json
          import time
          import tomllib
          import urllib.parse
          import urllib.request

          with open("pyproject.toml", "rb") as stream:
              expected = tomllib.load(stream)["project"]["version"]
          url = "https://api.comfy.org/nodes/yue2-t8/versions?include_status_reason=true"
          accepted = None
          for attempt in range(12):
              separator = "&" if "?" in url else "?"
              request = urllib.request.Request(url + separator + urllib.parse.urlencode({"audit": time.time_ns()}),
                                               headers={"User-Agent": "YuE2-Registry-Gate/1"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  versions = json.load(response)
              version = next((item for item in versions if item.get("version") == expected), None)
              if version:
                  accepted = version
                  break
              if attempt < 11:
                  time.sleep(5)
          if not accepted:
              raise SystemExit(f"Registry did not accept version {expected}")
          print(json.dumps({key: accepted.get(key) for key in ("version", "status", "status_reason")},
                           ensure_ascii=False, indent=2))
          status = accepted.get("status")
          if status in {"NodeVersionStatusBanned", "NodeVersionStatusFlagged"}:
              raise SystemExit(f"Registry rejected {expected}: {status}: {accepted.get('status_reason', '')}")
          if status == "NodeVersionStatusPending":
              print(f"Registry accepted {expected}; platform review is still pending")
          elif status != "NodeVersionStatusActive":
              raise SystemExit(f"Registry returned an unknown status for {expected}: {status}")
          PY
