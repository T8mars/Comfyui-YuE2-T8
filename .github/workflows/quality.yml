name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python, web and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b13 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install av numpy psutil requests scipy soundfile faiss-cpu safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Parse Python sources
        run: python -c "import ast,pathlib; files=list(pathlib.Path('.').rglob('*.py')); [ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p)) for p in files]; print(f'parsed {len(files)} Python files')"
      - name: Check browser JavaScript
        run: |
          node --check app/web/app.js
          node --check app/web/assistant.js
          node --check app/web/rvc.js
          node --check app/web/workbench.js
      - name: Install browser for UI smoke checks
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Run browser UI smoke checks
        run: python scripts/ui_browser_smoke.py --output browser-artifacts
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-ui-smoke
          path: browser-artifacts
          if-no-files-found: error
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
  windows-launcher:
    name: Windows launcher and updater checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b13 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build versioned launcher
        shell: pwsh
        run: |
          ./scripts/launcher/build_launcher.ps1 -OutputPath "$env:RUNNER_TEMP\YuE2-T8.exe"
          $info = (Get-Item -LiteralPath "$env:RUNNER_TEMP\YuE2-T8.exe").VersionInfo
          if ($info.ProductName -ne 'YuE2-T8 本地音乐工作室') { throw "Unexpected ProductName: $($info.ProductName)" }
          $project = Get-Content -LiteralPath pyproject.toml -Raw
          $expected = ([regex]::Match($project, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"$').Groups[1].Value + '.0')
          if ($info.FileVersion -ne $expected) { throw "Unexpected FileVersion: $($info.FileVersion), expected $expected" }
          $invalidPort = Start-Process -FilePath "$env:RUNNER_TEMP\YuE2-T8.exe" -ArgumentList '--port', '80', '--no-pause' -Wait -PassThru -NoNewWindow
          if ($invalidPort.ExitCode -ne 5) { throw "Invalid port should return 5, got $($invalidPort.ExitCode)" }
      - name: Run Windows update and bundle tests
        run: |
          python -m pip install numpy filelock
          python -m unittest discover -s tests -p "test_storage_paths.py" -v
          python -m unittest discover -s tests -p "test_unified_update.py" -v
          python -m unittest discover -s tests -p "test_update_install.py" -v
          python -m unittest discover -s tests -p "test_unified_bundle.py" -v
